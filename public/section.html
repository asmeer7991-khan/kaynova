<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"/>
 <meta name="viewport" content="width=device-width,initial-scale=1"/>
 <title>Section</title>
 <style>
  body{font-family:Arial,Helvetica,sans-serif;margin:24px}
  .bar{display:flex;gap:12px;align-items:center;margin-bottom:16px}
  .back{margin-right:auto;text-decoration:none}
  h1{margin:0;font-size:20px}
  .btns{display:flex;gap:10px;margin-top:8px}
  a.btn{display:inline-block;padding:12px 18px;border:1px solid #333;border-radius:8px;
     text-decoration:none;color:inherit;font-weight:700}
  a.btn:hover{background:#f3f3f3}
  .hint{margin-top:16px;color:#666}
 </style>
</head>
<body>
 <div class="bar">
  <a class="back" id="backLink">⬅ Back</a>
  <h1 id="secTitle">Section</h1>
 </div>

 <div class="btns">
  <a id="btnPurchase" class="btn">Purchase</a>
  <a id="btnSell" class="btn">Sell</a>
  <a id="btnProfit" class="btn">Profit</a>
 </div>

 <div class="hint" id="hint"></div>

 <script>
  const p = new URLSearchParams(location.search);
  const section = (p.get("section") || "").toUpperCase();
  document.getElementById("secTitle").textContent = section || "Section";
  document.getElementById("backLink").href = "/index.html";

  const secQ = encodeURIComponent(section);
  document.getElementById("btnPurchase").href = `/purchase.html?section=${secQ}`;
  document.getElementById("btnSell").href = `/sell.html?section=${secQ}`;
  document.getElementById("btnProfit").href = `/profit.html?section=${secQ}`;

  document.getElementById("hint").textContent =
   section ? `You are in ${section}. Choose an action.` : "No section selected.";
 </script>
</body>
</html>
