
<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"/>
 <meta name="viewport" content="width=device-width,initial-scale=1"/>
 <title>Login / Register</title>
 <link rel="stylesheet" href="style.css">

 <style>
  body{font-family:Arial,sans-serif;margin:40px;max-width:400px}
  h1{font-size:22px;margin-bottom:20px}
  input{width:100%;padding:10px;margin:6px 0;font-size:14px}
  button{padding:10px 16px;margin-top:10px;font-size:14px;width:49%}
  .row{display:flex;gap:2%}
  .msg{color:#0a7;font-weight:700;margin:10px 0;min-height:18px}
  .err{color:#b00;font-weight:700;margin:10px 0;min-height:18px}
 </style>
</head>
<body>

<h1>Login or Register</h1>

<input id="user" placeholder="Username"/>
<input id="pass" placeholder="Password" type="password"/>

<div class="row">
 <button id="login">Login</button>
 <button id="register">Register</button>
</div>

<div class="msg" id="msg"></div>
<div class="err" id="err"></div>

<script>
 const el = (s) => document.querySelector(s);
 const showMsg = (t) => { el("#msg").textContent = t; setTimeout(()=> el("#msg").textContent="", 1500); };
 const showErr = (t) => { el("#err").textContent = t; setTimeout(()=> el("#err").textContent="", 2000); };
 const params = new URLSearchParams(location.search);
const section = params.get("section") || "";  // will be MOM or KAYNOVA
const type = params.get("type") || "purchase";

 async function api(path, options={}) {
   const res = await fetch(path, { ...options, headers: { "Content-Type":"application/json", ...(options.headers||{}) } });
   if (!res.ok) throw new Error(await res.text().catch(()=> "Request failed"));
   return res.json();
 }

 // ===== LOGIN =====
 el("#login").onclick = async () => {
   const username = el("#user").value.trim();
   const password = el("#pass").value;
   if(!username || !password) return showErr("Fill both fields");

   try {
     const out = await api("/auth/login", { method:"POST", body: JSON.stringify({ username, password }) });
     localStorage.setItem("token", out.token);
     localStorage.setItem("user", JSON.stringify(out.user));
     showMsg("Logged in!");
     // redirect to section selection
    if(section) {
  if(type === "purchase") {
    window.location.href = `/purchase.html?section=${encodeURIComponent(section)}`;
  } else if(type === "sell") {
    window.location.href = `/sell.html?section=${encodeURIComponent(section)}`;
  } else if(type === "profit") {
    window.location.href = `/profit.html?section=${encodeURIComponent(section)}`;
  } else {
    window.location.href = `/section.html`;
  }
} else {
  window.location.href = "/index.html";
}
   } catch(e) { showErr(e.message||"Login failed"); }
 };

 // ===== REGISTER =====
 el("#register").onclick = async () => {
   const username = el("#user").value.trim();
   const password = el("#pass").value;
   if(!username || !password) return showErr("Fill both fields");

   try {
     const out = await api("/auth/register", { method:"POST", body: JSON.stringify({ username, password }) });
     localStorage.setItem("token", out.token);
     localStorage.setItem("user", JSON.stringify(out.user));
     showMsg("Registered & logged in!");
     // redirect to section selection
     window.location.href = "/section.html";
   } catch(e) { showErr(e.message||"Register failed"); }
 };
</script>

</body>
</html>
